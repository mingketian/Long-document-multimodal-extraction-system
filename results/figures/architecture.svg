<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 760" width="1320" height="760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="tlTitle tlDesc">
  <title id="tlTitle">Throughline architecture</title>
  <desc id="tlDesc">A long document is ingested into pages with OCR layout blocks, partitioned into bounded overlapping page groups, and read one group at a time. Each group's prompt fuses the schema, the page images, the layout text and the carry-over cross-page state. Model output is parsed under schema constraint, every citation is verified against a layout block, and the result merges into cross-page state. An early-exit policy stops the run once the schema is satisfied and evidenced.</desc>

  <style>
    .surface  { fill: #fcfcfb; }
    .card     { fill: #ffffff; stroke: #e2e1dc; stroke-width: 1.5; }
    .card-key { fill: #eef5fe; stroke: #2a78d6; stroke-width: 1.75; }
    .card-mut { fill: #f6f5f2; stroke: #e2e1dc; stroke-width: 1.5; }
    .lane     { fill: #f4f8fe; stroke: #d6e5f8; stroke-width: 1.5; }
    .t-title  { fill: #0b0b0b; font-size: 22px; font-weight: 700; }
    .t-sub    { fill: #84837c; font-size: 13px; }
    .t-lane   { fill: #2a78d6; font-size: 12px; font-weight: 700; letter-spacing: 0.09em; }
    .t-node   { fill: #0b0b0b; font-size: 14px; font-weight: 600; }
    .t-meta   { fill: #6c6b64; font-size: 11.5px; }
    .t-mono   { fill: #52514e; font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .t-step   { fill: #a3a29a; font-size: 11px; font-weight: 700; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .t-edge   { fill: #84837c; font-size: 11px; }
    .flow     { stroke: #b6b5ad; stroke-width: 1.75; fill: none; }
    .flow-o   { stroke: #2a78d6; stroke-width: 2; fill: none; }
    .flow-d   { stroke: #eb6834; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
  </style>

  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b6b5ad"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2a78d6"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#eb6834"/>
    </marker>
  </defs>

  <rect class="surface" x="0" y="0" width="1320" height="760"/>

  <text class="t-title" x="32" y="42">Throughline — cross-page state for long-document extraction</text>
  <text class="t-sub"   x="32" y="66">A 40-page document does not fit in one context window. It is read in bounded, overlapping groups, and the state carried between them is what makes that equivalent to reading the whole thing.</text>

  <!-- ── ingest ───────────────────────────────────────────────── -->
  <rect class="card" x="32" y="120" width="204" height="150" rx="10"/>
  <text class="t-step" x="50" y="146">INGEST</text>
  <text class="t-node" x="50" y="168">Document → pages</text>
  <text class="t-meta" x="50" y="188">Textract LAYOUT+TABLES,</text>
  <text class="t-meta" x="50" y="205">or the PDF text layer</text>
  <text class="t-mono" x="50" y="228">page image + blocks</text>
  <text class="t-meta" x="50" y="248">Each block knows its page,</text>
  <text class="t-meta" x="50" y="264">bbox and reading order.</text>

  <path class="flow" d="M 236 195 H 272" marker-end="url(#ag)"/>

  <!-- ── grouping ─────────────────────────────────────────────── -->
  <rect class="card-key" x="276" y="120" width="204" height="150" rx="10"/>
  <text class="t-step" x="294" y="146">PARTITION</text>
  <text class="t-node" x="294" y="168">Bounded page groups</text>
  <text class="t-mono" x="294" y="190">≤ 4 pages · ≤ 18k chars</text>
  <text class="t-mono" x="294" y="208">1 page of overlap</text>
  <text class="t-meta" x="294" y="230">Boundaries prefer a natural</text>
  <text class="t-meta" x="294" y="246">break; a page ending mid-</text>
  <text class="t-meta" x="294" y="262">table is a costly place to cut.</text>

  <path class="flow" d="M 480 195 H 516" marker-end="url(#ag)"/>

  <!-- ── retrieval ────────────────────────────────────────────── -->
  <rect class="card" x="520" y="120" width="204" height="150" rx="10"/>
  <text class="t-step" x="538" y="146">RETRIEVE</text>
  <text class="t-node" x="538" y="168">Relevant-page ranking</text>
  <text class="t-mono" x="538" y="190">BM25 + positional prior</text>
  <text class="t-meta" x="538" y="212">Scores pages against the</text>
  <text class="t-meta" x="538" y="228">keys still missing, so the</text>
  <text class="t-meta" x="538" y="244">promising group is read</text>
  <text class="t-meta" x="538" y="260">first rather than page 1.</text>

  <path class="flow" d="M 724 195 C 760 195 760 300 796 300" marker-end="url(#ag)"/>

  <!-- ── per-group loop ───────────────────────────────────────── -->
  <rect class="lane" x="32" y="316" width="1256" height="316" rx="12"/>
  <text class="t-lane" x="52" y="342">PER PAGE GROUP · REPEATED UNTIL THE SCHEMA IS SATISFIED</text>

  <rect class="card" x="56" y="366" width="228" height="146" rx="9"/>
  <text class="t-step" x="74" y="390">01 · PROMPT</text>
  <text class="t-node" x="74" y="412">Fuse four signals</text>
  <text class="t-meta" x="74" y="433">· schema, with types</text>
  <text class="t-meta" x="74" y="450">· page images</text>
  <text class="t-meta" x="74" y="467">· block-addressed layout text</text>
  <text class="t-meta" x="74" y="484">· carry-over state</text>
  <text class="t-mono" x="74" y="503">prompting/templates.py</text>

  <path class="flow-o" d="M 284 439 H 320" marker-end="url(#ab)"/>

  <rect class="card" x="324" y="366" width="212" height="146" rx="9"/>
  <text class="t-step" x="342" y="390">02 · GENERATE</text>
  <text class="t-node" x="342" y="412">Qwen2.5-VL-7B</text>
  <text class="t-meta" x="342" y="433">SageMaker endpoint, or</text>
  <text class="t-meta" x="342" y="450">local + LoRA adapter</text>
  <text class="t-meta" x="342" y="472">Prompt cache keyed on</text>
  <text class="t-meta" x="342" y="488">prompt + config + backend.</text>
  <text class="t-mono" x="342" y="507">models/</text>

  <path class="flow-o" d="M 536 439 H 572" marker-end="url(#ab)"/>

  <rect class="card" x="576" y="366" width="212" height="146" rx="9"/>
  <text class="t-step" x="594" y="390">03 · CONSTRAIN</text>
  <text class="t-node" x="594" y="412">Schema-constrained</text>
  <text class="t-meta" x="594" y="433">Grammar at decode time</text>
  <text class="t-meta" x="594" y="450">where supported; defensive</text>
  <text class="t-meta" x="594" y="467">parse and repair where not.</text>
  <text class="t-meta" x="594" y="489">Truncated output is salvaged,</text>
  <text class="t-meta" x="594" y="505">never silently dropped.</text>

  <path class="flow-o" d="M 788 439 H 824" marker-end="url(#ab)"/>

  <rect class="card-key" x="828" y="366" width="212" height="146" rx="9"/>
  <text class="t-step" x="846" y="390">04 · ATTRIBUTE</text>
  <text class="t-node" x="846" y="412">Verify every citation</text>
  <text class="t-meta" x="846" y="433">block id → quote → value,</text>
  <text class="t-meta" x="846" y="450">tried in that order.</text>
  <text class="t-meta" x="846" y="472">A citation that resolves to</text>
  <text class="t-meta" x="846" y="488">nothing is marked unverified</text>
  <text class="t-meta" x="846" y="505">rather than trusted.</text>

  <path class="flow-o" d="M 1040 439 H 1076" marker-end="url(#ab)"/>

  <rect class="card-key" x="1080" y="366" width="184" height="146" rx="9"/>
  <text class="t-step" x="1098" y="390">05 · MERGE</text>
  <text class="t-node" x="1098" y="412">Cross-page state</text>
  <text class="t-meta" x="1098" y="433">Fields resolve by</text>
  <text class="t-meta" x="1098" y="450">confidence; table rows</text>
  <text class="t-meta" x="1098" y="467">accumulate and dedupe</text>
  <text class="t-meta" x="1098" y="484">on their row key.</text>
  <text class="t-mono" x="1098" y="503">state/cross_page.py</text>

  <!-- carry-over feedback -->
  <path class="flow-d" d="M 1172 512 V 560 H 170 V 512" marker-end="url(#ao)"/>
  <rect fill="#f4f8fe" x="520" y="548" width="290" height="22"/>
  <text class="t-edge" x="528" y="564">carry-over: what is settled, what is still missing</text>

  <!-- ── exit + output ────────────────────────────────────────── -->
  <path class="flow-o" d="M 1264 439 C 1292 439 1292 690 660 690" marker-end="url(#ab)"/>

  <rect class="card-mut" x="32" y="654" width="256" height="74" rx="9"/>
  <text class="t-step" x="50" y="678">06 · EXIT POLICY</text>
  <text class="t-meta" x="50" y="698">Stop when every required key is</text>
  <text class="t-meta" x="50" y="714">present, valid, and evidenced —</text>

  <rect class="card-key" x="304" y="654" width="256" height="74" rx="9"/>
  <text class="t-step" x="322" y="678">GUARD</text>
  <text class="t-meta" x="322" y="698">— but never while a table is still</text>
  <text class="t-meta" x="322" y="714">open. Stopping mid-table truncates.</text>

  <rect class="card" x="672" y="654" width="592" height="74" rx="9"/>
  <text class="t-step" x="690" y="678">OUTPUT</text>
  <text class="t-node" x="690" y="700">Schema-valid record  +  evidence map  +  per-group trace</text>
  <text class="t-meta" x="690" y="719">Every value carries the page, block id and quote it was read from.</text>
</svg>

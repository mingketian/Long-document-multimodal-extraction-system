name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests and lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tools tests

      - name: Test
        run: pytest -q

      - name: The pipeline runs end to end with no model and no cloud
        run: |
          throughline schemas
          throughline inspect examples/documents/invoice_0001.json --schema invoice
          throughline extract examples/documents/invoice_0001.json --schema invoice --quiet
          throughline sweep examples/corpus_agreements --schema service_agreement --no-mlflow

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if a .env was committed
        run: |
          if git ls-files | grep -E '(^|/)\.env(\.|$)' | grep -v '\.env\.example'; then
            echo "::error::A .env file is tracked. Remove it and rotate any credential in it."
            exit 1
          fi
          echo "No tracked .env files."

      - name: Fail on files over 10 MB
        run: |
          large=$(git ls-files | xargs -I{} du -k "{}" | awk '$1 > 10240 {print $2}')
          if [ -n "$large" ]; then
            echo "::error::Files over 10 MB are tracked:"; echo "$large"; exit 1
          fi
          echo "No oversized files."

      - name: The synthetic corpus regenerates deterministically
        run: |
          python -m pip install --upgrade pip >/dev/null
          pip install -e . >/dev/null
          python tools/make_examples.py
          if ! git diff --quiet -- examples; then
            echo "::error::examples/ is stale. Run 'make examples' and commit."
            git diff --stat -- examples
            exit 1
          fi
          echo "Corpus matches its generator."
